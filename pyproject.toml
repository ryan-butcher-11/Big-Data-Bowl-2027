[project]
name = "bdb-2027"
version = "0.1.0"
description = "Analyzing NFL Combine tracking data to identify movement characteristics associated with on-field performance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "kaleido>=1.0.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
